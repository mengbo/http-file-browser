<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>需要访问凭证 — http-file-browser</title>
  <!-- 登录页必须自包含：未认证时它自身就是响应体，任何外部资源引用（样式表或脚本标签）
       都会发出同样未认证的请求而拿不到资源（add-remote-access design D7）。样式一律内联。 -->
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }
    main {
      width: min(22rem, calc(100vw - 3rem));
      padding: 2rem;
      background: #ffffff;
      border-radius: 0.75rem;
      box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.1);
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.25rem; }
    p { margin: 0 0 1.25rem; color: #6e6e73; font-size: 0.875rem; line-height: 1.5; }
    form { display: flex; flex-direction: column; gap: 0.75rem; }
    input, button {
      font: inherit;
      padding: 0.625rem 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid #d2d2d7;
    }
    input:focus { outline: 2px solid #0071e3; outline-offset: 1px; border-color: #0071e3; }
    button {
      border-color: #0071e3;
      background: #0071e3;
      color: #ffffff;
      cursor: pointer;
    }
    button:hover { background: #0077ed; }
    @media (prefers-color-scheme: dark) {
      body { background: #1c1c1e; color: #f5f5f7; }
      main { background: #2c2c2e; box-shadow: none; }
      p { color: #a1a1a6; }
      input { background: #1c1c1e; border-color: #48484a; color: inherit; }
    }
  </style>
</head>
<body>
  <main>
    <h1>需要访问凭证</h1>
    <p>本服务已启用远程访问。请输入启动时在服务端输出的访问凭证。</p>
    <form method="get" action="/">
      <input type="password" name="token" placeholder="访问凭证" aria-label="访问凭证" autocomplete="off" autofocus required>
      <button type="submit">进入</button>
    </form>
  </main>
</body>
</html>
