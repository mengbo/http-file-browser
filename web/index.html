<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>http-file-browser</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="browser">
    <header class="toolbar">
      <h1 class="title">http-file-browser</h1>
      <p id="location" class="location" aria-live="polite">正在加载…</p>
    </header>

    <p id="error" class="error" role="alert" hidden></p>

    <nav class="parent">
      <a id="parent-link" class="parent-link" href="/" hidden>↑ 上级目录</a>
    </nav>

    <ul id="entries" class="entries"></ul>

    <p id="empty" class="empty" hidden>此目录为空</p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
